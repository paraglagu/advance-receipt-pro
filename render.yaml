services:
  - type: web
    name: advance-receipt-pro
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npx remix-serve ./build/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SCOPES
        value: read_orders,read_customers,read_products
      - key: SHOPIFY_APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: advance-receipt-pro-db
          property: connectionString

databases:
  - name: advance-receipt-pro-db
    plan: free
